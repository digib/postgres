# Builds the image for x86 and Arm, checks its extensions, and publishes it to
# ghcr.io/digib/postgres as `18` and `18-<date>`. Weekly too, for PostgreSQL's and the extensions'
# fixes, which the base image and the apt repository bring.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for checking
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: postgres:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the extensions
        run: |
          docker run -d --name check -e POSTGRES_PASSWORD=check postgres:check
          until docker exec check pg_isready -U postgres -q; do sleep 1; done
          sleep 2
          docker exec check psql -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION postgis;
            CREATE EXTENSION postgis_topology;
            CREATE EXTENSION postgis_tiger_geocoder CASCADE;
            CREATE EXTENSION vector;
            CREATE EXTENSION pg_trgm;
            CREATE EXTENSION hypopg;
            CREATE EXTENSION pg_stat_statements;
            SELECT extname, extversion FROM pg_extension ORDER BY extname;
            SELECT '[1,2,3]'::vector <=> '[1,2,4]'::vector AS cosine_distance, ST_AsText(ST_MakePoint(24.57, 59.34)) AS point;
            SELECT indexname AS hypothetical_index FROM hypopg_create_index('CREATE INDEX ON pg_class (relname)');
            SELECT count(*) > 0 AS statements_tracked FROM pg_stat_statements;"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/digib/postgres
          tags: |
            type=raw,value=18
            type=raw,value=18-{{date 'YYYYMMDD'}}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
